# 阶段分类规则。程序代码中不写业务关键词，全部在此配置。
# 字段说明：
#   id          规则编号，写入映射表判定依据
#   stage       阶段；第 4 阶段写 第4阶段，按项目层级落为 实施方案 或 年度设计
#   subdir      固定子目录，仅野外验收、成果评审使用
#   file_type   文件类型，须在 stages.yaml 词表内；第 4 阶段写成 {二级项目: x, 三级项目: y}
#   categories  类别代码约束，Z S T B J K R M Q 为成果九类，GL 为管理性文件
#   keywords    题名关键词，命中任一即命中
#   exclude     排除词，命中任一则该规则作废
#   weight      命中得分，0 至 1
# 类别代码：Z 正文 S 审批 T 附图 B 附表 J 附件 K 数据库 R 软件 M 多媒体 Q 其他 GL 管理性文件
version: "C1.0.0"

common_exclude_stage4: &ex_stage4 [评审, 审查, 批复, 审批, 意见]

rules:
  # ---------- 成果评审 ----------
  - id: CG-BG-01
    stage: 成果评审
    subdir: 成果评审
    file_type: 成果报告
    categories: [Z]
    keywords: [报告, 说明书, 总结]
    exclude: [简报, 月报, 自评报告, 野外验收报告, 续作评估报告, 立项论证报告, 年度考核报告]
    weight: 0.90
  - id: CG-BG-02
    stage: 成果评审
    subdir: 成果评审
    file_type: 成果报告
    categories: [Z]
    keywords: ["*"]
    weight: 0.75
  - id: CG-YJ-01
    stage: 成果评审
    subdir: 成果评审
    file_type: 成果评审意见
    categories: [S, Q, J]
    keywords: [评审意见, 评审备案证明, 评审备案, 评审决议, 认定书, 成果报告评审]
    exclude: [设计, 方案, 野外验收, 任务书, 立项, 续作, 年度考核, 信息化, 数据库评审]
    weight: 0.90
  - id: CG-YJ-02
    stage: 成果评审
    subdir: 成果评审
    file_type: 成果评审意见
    categories: [S]
    keywords: [审查意见, 审字]
    exclude: [设计, 方案, 野外验收, 任务书, 立项, 续作, 年度考核, 信息化]
    weight: 0.60
  - id: CG-JL-01
    stage: 成果评审
